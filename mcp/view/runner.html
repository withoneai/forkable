<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The tokens generated UIs style with. Same palette, radii and squircles
         as the website (src/web-ui.ts LIGHT/DARK). Keep the old names working:
         saved UIs use bg-card, border-border, bg-primary, text-11/13/15/28. -->
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
      :root {
        --background: #fbfdfc; --foreground: #002215; --muted-foreground: #627b6f;
        --card: color-mix(in oklch, #fbfdfc 97%, #002215 3%);
        --raised: #ffffff;
        --border: color-mix(in oklch, #fbfdfc 88%, #002215 12%);
        --strong: color-mix(in oklch, #fbfdfc 76%, #002215 24%);
        --accent: #809d08;
        --primary: #cced73; --primary-hover: #b3d258; --primary-press: #9ab83b; --primary-foreground: #000000;
        --danger: #b42318;
        --soft-shadow: 0 1px 2px rgb(0 34 21 / .04), 0 8px 24px -12px rgb(0 34 21 / .12);
        color-scheme: light;
      }
      .dark {
        --background: #000000; --foreground: #e9faf2; --muted-foreground: #779084;
        --card: color-mix(in oklch, #000000 91%, #e9faf2 9%);
        --raised: color-mix(in oklch, #000000 81%, #e9faf2 19%);
        --border: color-mix(in oklch, #000000 82%, #e9faf2 18%);
        --strong: color-mix(in oklch, #000000 68%, #e9faf2 32%);
        --accent: #cced73;
        --danger: #f97066;
        --soft-shadow: 0 0 0 1px rgb(233 250 242 / .02), 0 12px 32px -16px rgb(0 0 0 / .8);
        color-scheme: dark;
      }
      @theme inline {
        --color-background: var(--background); --color-foreground: var(--foreground);
        --color-muted-foreground: var(--muted-foreground); --color-card: var(--card);
        --color-raised: var(--raised); --color-border: var(--border); --color-strong: var(--strong);
        --color-accent: var(--accent); --color-danger: var(--danger);
        --color-primary: var(--primary); --color-primary-hover: var(--primary-hover);
        --color-primary-press: var(--primary-press); --color-primary-foreground: var(--primary-foreground);
        --shadow-soft: var(--soft-shadow);
        --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        --text-10: 0.625rem; --text-10--line-height: 1rem;
        --text-11: 0.6875rem; --text-11--line-height: 1rem;
        --text-13: 0.8125rem; --text-13--line-height: 1.25rem;
        --text-15: 0.9375rem; --text-15--line-height: 1.375rem;
        --text-28: 1.75rem; --text-28--line-height: 2.125rem;
        --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem;
      }
      html, body { margin: 0; }
      body { font-size: 0.875rem; line-height: 1.375rem; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      @supports (corner-shape: squircle) {
        [class*="rounded-"]:not([class*="rounded-full"]), .squircle { corner-shape: squircle; }
      }
    </style>
  </head>
  <body class="bg-background text-foreground font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="./runner.tsx"></script>
  </body>
</html>
