<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Not found · Search</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark light; --bg: #000000; --fg: #ededed; --muted: #a1a1a1; --line: #222; }
      @media (prefers-color-scheme: light) { :root { --bg: #fbfdfc; --fg: #0a0a0a; --muted: #5b6b63; --line: #dfe7e3; } }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { text-align: center; padding: 24px; }
      h1 { font: 400 44px/1.1 "Instrument Serif", ui-serif, Georgia, serif; margin: 16px 0 8px; letter-spacing: -0.01em; }
      p { color: var(--muted); margin: 0 0 24px; }
      a { color: var(--fg); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; text-decoration: none; font-size: 13px; }
      img { width: 40px; height: 40px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Nothing here</h1>
      <p>That page does not exist.</p>
      <a href="/">Back to Search</a>
    </main>
  </body>
</html>
